# CI for every pull request and push to main (AGENTS.md section 10).
# Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  NODE_VERSION: "24"

jobs:
  app:
    name: App (format, analyze, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generated code (API client, freezed, Riverpod, l10n) is up to date
        run: |
          dart run swagger_parser
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/core/api/generated
          git add --intent-to-add lib
          git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage
      - name: Coverage thresholds (overall 70%, domain 90%)
        run: dart run tool/check_coverage.dart coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-failures
          path: app/test/**/failures/
          if-no-files-found: ignore

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug

  functions:
    name: Workers (format, lint, types, test against a local database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            package-lock.json
      - name: Start a local database for the integration tests (ADR-0017)
        working-directory: .
        run: |
          npm ci
          npx supabase db start
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:api
      - name: Generated contract code is up to date
        run: |
          npm run generate:api
          git add --intent-to-add src/api/generated
          git diff --exit-code -- src/api/generated
      - run: npm run types:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage

  api-contract:
    name: API contract (no breaking changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare with the base branch (ADR-0015)
        env:
          # Passed through env, not interpolated into the script.
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git show "origin/${BASE_REF}:functions/openapi.yaml" > /tmp/base.yaml 2>/dev/null; then
            echo "No spec on the base branch yet: nothing to compare."
            exit 0
          fi
          docker run --rm -v /tmp:/base:ro -v "$PWD/functions:/head:ro" \
            tufin/oasdiff:v1.34.1 breaking /base/base.yaml /head/openapi.yaml --fail-on ERR

  database:
    name: Database (migrations on fresh DB, pgTAP tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start a fresh database and apply all migrations
        run: npx supabase db start
      - run: npx supabase test db
      - run: npx supabase db lint --level warning --fail-on warning

  presets:
    name: Presets (schema, rules, app copy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run presets:test
      # Schema, duplicate and range rules, and the app's bundled copy.
      - run: npm run presets:validate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerability scan
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./
