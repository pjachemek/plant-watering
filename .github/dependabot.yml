version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: [/, /functions]
    schedule: { interval: weekly }
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly }
