# Strict lints (NFR Maintainability: zero warnings in CI). See ADR-0003.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
    # Generated from functions/openapi.yaml (ADR-0015); CI checks it is current.
    - lib/core/api/generated/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Missing awaits and unused results hide real bugs; treat as errors.
    unawaited_futures: error
    discarded_futures: error

linter:
  rules:
    # Not a published package; public API docs are required only where useful.
    public_member_api_docs: false
