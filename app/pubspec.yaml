name: plantnfc
description: "Tap a plant pot to see how and when to water it."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  meta: ^1.19.0
  riverpod_annotation: ^4.0.7
  sentry_flutter: ^10.2.0

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
