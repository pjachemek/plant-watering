name: plantnfc
description: "Tap a plant pot to see how and when to water it."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  gotrue: ^2.27.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.19.0
  ndef_record: ^1.5.0
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  sentry_flutter: ^10.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  http: ^1.6.0
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.2
  riverpod_generator: ^4.0.9
  swagger_parser: ^1.45.0
  very_good_analysis: ^11.0.0

flutter:
